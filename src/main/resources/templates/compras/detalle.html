<!doctype html>
<html lang="es" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detalle de compra | Minimarket</title><link rel="stylesheet" th:href="@{/css/aplicacion.css}"><link rel="stylesheet" th:href="@{/css/compras.css}"></head>
<body><header class="barra-superior"><a class="marca enlace-marca" th:href="@{/}">Minimarket</a><a class="enlace-volver" th:href="@{/compras}">Volver a compras</a></header><main class="contenido-principal"><h1 th:text="${(compra.completa?'Compra #':'Ingreso #')+compra.id}"></h1>
<p class="mensaje-formulario mensaje-exito" th:if="${mensaje}" th:text="${mensaje}"></p>
<dl class="resumen-reporte"><dt>Fecha de registro</dt><dd th:text="${#temporals.format(compra.fecha,'dd/MM/yyyy HH:mm')}"></dd><dt>Proveedor</dt><dd th:text="${compra.proveedor}"></dd><dt>Documento</dt><dd th:text="${compra.documento?:'-'}"></dd><dt>Registrado por</dt><dd th:text="${compra.responsable}"></dd><dt>Total de compra</dt><dd th:text="${'S/ '+#numbers.formatDecimal(compra.total,1,2)}"></dd></dl>
<p th:if="${compra.observacion}" th:text="${compra.observacion}"></p>
<div class="tabla-contenedor"><table><thead><tr><th>Producto</th><th>Cantidad recibida</th><th>Costo por kg/unidad</th><th>Subtotal</th></tr></thead><tbody><tr th:each="d:${detalles}"><td th:text="${d.producto}"></td><td th:text="${#numbers.formatDecimal(d.cantidad,1,2)+(d.tipo=='PESO'?' kg':' unidades')}"></td><td th:text="${'S/ '+#numbers.formatDecimal(d.costo,1,2)}"></td><td th:text="${'S/ '+#numbers.formatDecimal(d.subtotal,1,2)}"></td></tr></tbody></table></div>
<div class="pie-panel"><a class="boton-secundario" th:href="@{/compras}">Ver compras</a><a class="boton-secundario" th:href="@{/stock}">Ver stock</a></div></main></body></html>
