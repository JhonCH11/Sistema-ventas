<!doctype html><html lang="es" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Importar desde Excel | Minimarket</title><link rel="stylesheet" th:href="@{/css/aplicacion.css}"></head>
<body><header class="barra-superior"><a class="marca enlace-marca" th:href="@{/}">Minimarket</a><a th:href="@{/}">Volver al inicio</a></header><main class="contenido-principal"><p class="etiqueta">Administraci&#243;n</p><h1>Importar desde Excel</h1>
<p class="mensaje-formulario mensaje-exito" th:if="${mensaje}" th:text="${mensaje}"></p><p class="mensaje-formulario mensaje-error" th:if="${error}" th:text="${error}" role="alert"></p>
<div class="pie-panel"><a class="boton-secundario" th:href="@{/importaciones/excel/plantilla(tipo='PRODUCTOS')}">Plantilla de productos</a><a class="boton-secundario" th:href="@{/importaciones/excel/plantilla(tipo='STOCK')}">Plantilla de entradas</a></div>
<form class="formulario-movimiento-caja" th:action="@{/importaciones/excel/revisar}" method="post" enctype="multipart/form-data" style="margin-top:24px">
<div class="campo-formulario"><label for="tipo">Tipo de carga</label><select id="tipo" name="tipo" required><option value="PRODUCTOS" th:selected="${tipo!=null and tipo.name()=='PRODUCTOS'}">Productos nuevos, sin stock inicial</option><option value="STOCK" th:selected="${tipo!=null and tipo.name()=='STOCK'}">Entrada de mercader&#237;a a productos existentes</option></select></div>
<div class="campo-formulario"><label for="referencia">Referencia &#250;nica de la carga</label><input id="referencia" name="referencia" maxlength="100" th:value="${referencia}" placeholder="Compra-2026-001" required></div>
<div class="campo-formulario"><label for="archivo">Archivo .xlsx, hasta 2 MB y 500 filas</label><input id="archivo" name="archivo" type="file" accept=".xlsx" required></div><button class="boton-principal boton-ancho-auto">Revisar archivo</button></form>
<section th:if="${previa!=null}"><h2 th:text="${'Vista previa: '+previa.filas.size()+' filas'}"></h2><p th:text="${'Referencia: '+previa.referencia}"></p>
<p class="mensaje-formulario mensaje-error" th:unless="${previa.valida}">Hay errores. No se registrar&#225; ninguna fila hasta corregir el archivo.</p>
<div class="tabla-contenedor"><table><thead><tr><th>Fila</th><th>Producto</th><th th:if="${previa.tipo.name()=='PRODUCTOS'}">Categor&#237;a / venta</th><th th:if="${previa.tipo.name()=='PRODUCTOS'}">Precio / m&#237;nimo</th><th th:if="${previa.tipo.name()=='STOCK'}">Cantidad</th><th th:if="${previa.tipo.name()=='STOCK'}">Costo por kg/unidad</th><th>Validaci&#243;n</th></tr></thead><tbody>
<tr th:each="f:${previa.filas}"><td th:text="${f.numero}"></td><td th:text="${f.nombre}"></td><td th:if="${previa.tipo.name()=='PRODUCTOS'}" th:text="${f.categoria+' / '+f.tipo}"></td><td th:if="${previa.tipo.name()=='PRODUCTOS'}" th:text="${f.precio+' / '+f.minimo}"></td><td th:if="${previa.tipo.name()=='STOCK'}" th:text="${f.cantidad+(f.tipo!=null and f.tipo.name()=='PESO'?' kg':' unidades')}"></td><td th:if="${previa.tipo.name()=='STOCK'}" th:text="${f.costo}"></td><td><span th:if="${#lists.isEmpty(f.errores)}">Correcta</span><ul th:unless="${#lists.isEmpty(f.errores)}"><li class="error-formulario" th:each="e:${f.errores}" th:text="${e}"></li></ul></td></tr></tbody></table></div>
<div class="pie-panel"><form th:if="${previa.valida}" th:action="@{/importaciones/excel/confirmar}" method="post"><input type="hidden" name="token" th:value="${previa.token}"><button class="boton-principal boton-ancho-auto">Confirmar importaci&#243;n</button></form><form th:action="@{/importaciones/excel/cancelar}" method="post"><button class="boton-secundario">Descartar vista previa</button></form></div>
</section></main></body></html>
