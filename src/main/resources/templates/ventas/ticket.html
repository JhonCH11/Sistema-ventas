<!doctype html>
<html lang="es" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket interno</title><link rel="stylesheet" th:href="@{/css/aplicacion.css}"><link rel="stylesheet" th:href="@{/css/ticket.css}"><script defer th:src="@{/js/ticket.js}"></script></head>
<body><main class="contenido-principal ticket-contenido formato-ticket"><h1 th:text="${negocio.nombre}" style="overflow-wrap:anywhere">Minimarket</h1><p th:if="${not #strings.isEmpty(negocio.direccion)}" th:text="${negocio.direccion}" style="overflow-wrap:anywhere"></p><p th:if="${not #strings.isEmpty(negocio.telefono)}" th:text="${negocio.telefono}"></p><p>Ticket interno sin validez tributaria</p><p th:text="${ticket.venta.numeroTicket}"></p><p th:text="${#temporals.format(ticket.venta.vendidaEn,'dd/MM/yyyy HH:mm')}"></p>
<p th:text="${'Estado: ' + ticket.venta.estado}"></p>
<div class="acciones-formulario"><a class="boton-secundario" th:href="@{/ventas/ticket/{n}/correcciones(n=${ticket.venta.numeroTicket})}">Anulaciones y devoluciones</a><a th:href="@{/ventas/realizadas}">Ventas realizadas</a></div>
<div class="tabla-contenedor"><table><thead><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Total</th></tr></thead><tbody><tr th:each="d : ${ticket.detalles}"><td th:text="${d.productoNombre}"></td><td th:text="${d.cantidad + (d.tipoVenta.name() == 'PESO' ? ' kg' : ' unid.')}"></td><td th:text="${d.precioUnitario}"></td><td th:text="${d.subtotal}"></td></tr></tbody></table></div><h2 th:text="${'Total: S/ ' + ticket.venta.total}"></h2><p th:text="${'Pago: ' + ticket.pago.medioPago}"></p><p th:if="${ticket.pago.importeRecibido != null}" th:text="${'Recibido: S/ ' + ticket.pago.importeRecibido + ' | Vuelto: S/ ' + ticket.pago.vuelto}"></p>
<div class="acciones-formulario controles-impresion"><div class="campo-formulario"><label for="formato-impresion">Formato de papel</label><select id="formato-impresion"><option value="ticket">Ticket de 80 mm</option><option value="a4">Hoja A4</option></select></div><button id="imprimir" class="boton-secundario" type="button">Imprimir o reimprimir</button><a class="boton-principal boton-ancho-auto" th:href="@{/ventas}">Nueva venta</a><a th:href="@{/}">Inicio</a></div><p id="aviso-impresion" class="aviso-impresion" role="status" hidden></p></main></body></html>
